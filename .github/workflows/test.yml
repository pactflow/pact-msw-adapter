name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - msw-compat

    steps:
      - name: Failed
        run: exit 1
        if: |
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')

  build-and-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node-version: [22, 24, 26]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
        shell: bash
      - run: npm run dist:ci
        shell: bash
      - run: npm run example:install
        shell: bash
      - run: npm run example:test:unit
        shell: bash
      - run: npm run example:test:cy:run
        shell: bash

  # The lockfile pins the latest msw major. This job runs the suite against
  # the older majors that the `msw: >=2.0.0` peer range still accepts.
  msw-compat:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: msw-compat (msw@${{ matrix.msw-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        msw-version: [2]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save msw@${{ matrix.msw-version }}
      - name: Check installed msw major
        run: >-
          node -e "const v = require('msw/package.json').version;
          console.log('msw', v);
          if (v.split('.')[0] !== '${{ matrix.msw-version }}') process.exit(1)"
      - run: npm run type-check
      - run: npm test
